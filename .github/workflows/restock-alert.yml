name: Restock alerts (Hirono / After Dark)

on:
  schedule:
    # Every 5 minutes (GitHub's minimum). Runs may be delayed under load.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # allow manual "Run workflow" for testing

# Needed so the job can commit the updated state file back.
permissions:
  contents: write

concurrency:
  group: restock-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scan Pop Mart PH and send WhatsApp alerts
        env:
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_TO: ${{ secrets.WA_TO }}
          WA_TEMPLATE: restock_alert
          WA_LANG: en_US
          ALERT_KEYWORD: hirono
        run: node scripts/check-alerts.mjs

      - name: Commit state changes (if any)
        run: |
          if [[ -n "$(git status --porcelain data/hirono-state.json)" ]]; then
            git config user.name "popmart-sentry-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/hirono-state.json
            git commit -m "chore: update stock state [skip ci]"
            git push
          else
            echo "No state change."
          fi
