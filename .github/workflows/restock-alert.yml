name: Restock alerts (Hirono / After Dark)

# GitHub's scheduler is unreliable for frequent crons — it fires this every few
# HOURS, not every 5 min. So each run self-loops for ~5 hours polling every 60s,
# committing the log/state on change. With concurrency, when one long run ends the
# next queued schedule takes over → near-continuous coverage. Public repo => free.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: restock-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Poll Pop Mart PH every 60s for ~5 hours, commit on change
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_KEYWORD: hirono
        run: |
          git config user.name "popmart-sentry-bot"
          git config user.email "bot@users.noreply.github.com"
          END=$((SECONDS + 18000))   # ~5 hours
          while [ "$SECONDS" -lt "$END" ]; do
            node scripts/check-alerts.mjs || true
            if [ -n "$(git status --porcelain data/)" ]; then
              git add data/
              git commit -m "chore: update stock state + restock log [skip ci]" || true
              for i in 1 2 3; do
                if git pull --rebase --autostash origin main && git push; then break; fi
                sleep 3
              done
            fi
            sleep 60
          done
